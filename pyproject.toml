[project]
name = "go-fuzz-action"
version = "1.0.0"
description = "Stateless native Go fuzzing orchestration for GitHub Actions"
readme = "README.md"
requires-python = ">=3.14"
license = { file = "LICENSE" }
dependencies = []

[build-system]
requires = ["uv_build==0.13.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "go_fuzz"
module-root = ""

[dependency-groups]
dev = [
    "coverage==7.13.3",
    "mypy==2.4.1",
    "ruff==0.17.6",
]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
# Prefer safe, idiomatic Python over mechanical PEP 8 compliance alone.
select = [
    "E4", "E7", "E9", "F",  # correctness
    "I", "N", "UP",           # imports, naming, modern syntax
    "B", "S", "SIM", "C4",   # bugs, Bandit security rules, simplifications
    "RET", "PIE", "PTH",     # return flow, idioms, pathlib
    "C901", "PLR0912", "PLR0915",  # function complexity, branches, statements
    "PERF", "PLC", "PLE", "PLW", "RUF",  # performance and maintainability
    "T10", "T20",            # debugging and accidental prints
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-branches = 12
max-statements = 50

[tool.ruff.format]
# Preserve intentional one-argument-per-line calls with trailing commas.
skip-magic-trailing-comma = false

[tool.ruff.lint.per-file-ignores]
# The fuzz runner invokes the trusted Go executable without a shell.
# S603/S607/S404 otherwise warn on all uses of subprocess, even argv-only calls.
"go_fuzz/native_go/runner.py" = ["S404", "S603", "S607"]
# CLI output is intentional; the domain code performs no console output.
"go_fuzz/cli.py" = ["T201"]
# unittest's assert helpers, fixture subprocesses and /tmp symlink targets are deliberate.
"tests/**" = ["S101", "S603", "S607", "S108", "T201"]

[tool.mypy]
python_version = "3.14"
files = ["go_fuzz"]
check_untyped_defs = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
strict_equality = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true

[tool.uv]
required-version = "==0.13.10"

[tool.coverage.run]
branch = true
source = ["go_fuzz"]
