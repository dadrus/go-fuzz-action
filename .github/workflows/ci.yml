name: Action CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions: {}

jobs:
  security:
    name: Security
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    timeout-minutes: 25
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit workflow security
        uses: zizmorcore/zizmor-action@1b4550e929643b8b26a62303c6bd64814271a4f1 # v0.9.2
        with:
          advanced-security: false
      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version-file: pyproject.toml
      - name: Install project and development tools from the lockfile
        run: uv sync --locked
      - name: Audit Python dependencies for known vulnerabilities
        run: uv audit

  lint:
    name: Lint
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    timeout-minutes: 25
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version-file: pyproject.toml
      - name: Install project and development tools from the lockfile
        run: uv sync --locked
      - name: Ruff lint (including security rules)
        run: uv run --no-sync ruff check .
      - name: Ruff format
        run: uv run --no-sync ruff format --check .
      - name: Type check
        run: uv run --no-sync mypy go_fuzz

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    timeout-minutes: 25
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version-file: pyproject.toml
      - name: Install project and development tools from the lockfile
        run: uv sync --locked
      - name: Unit tests
        run: uv run --no-sync coverage run -m unittest discover -s tests/unit -t . -v
      - name: Generate coverage report
        run: uv run --no-sync coverage xml
      - name: Upload code coverage report to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          report_type: coverage
          files: coverage.xml
          verbose: true
          token: ${{ secrets.CODECOV_TOKEN }}

  integration-tests:
    name: Integration tests
    needs: [security, lint, unit-tests]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    timeout-minutes: 25
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version-file: pyproject.toml
      - name: Install project from the lockfile
        run: uv sync --locked --no-dev
      - name: Install Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.27.4'
          cache: false
      - name: Integration tests
        run: uv run --no-sync python -m unittest discover -s tests/integration -t . -v

  build:
    name: Build
    needs: integration-tests
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    timeout-minutes: 25
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version-file: pyproject.toml
      - name: Verify package build
        run: uv build
